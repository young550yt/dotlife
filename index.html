<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Dot — a tiny life</title>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%}
#c{display:block;background:#000;cursor:crosshair}
#hud{position:fixed;left:20px;bottom:18px;pointer-events:none;
  font:13.5px/1.5 Consolas,"Cascadia Mono","Courier New",monospace;
  user-select:none;-webkit-user-select:none}
#activity{color:rgba(255,255,255,.66);letter-spacing:.16em;
  text-shadow:0 0 12px rgba(255,255,255,.18)}
#activity.anim{animation:fadein .55s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#hint{margin-top:5px;font-size:11.5px;color:rgba(255,255,255,.26);letter-spacing:.1em;
  transition:opacity 1.2s}
#hint.gone{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="activity">walking around</div>
  <div id="hint">sit back — it feeds itself</div>
</div>

<script>
'use strict';
(function(){
/* ------------------------------------------------------------------ setup */
var cv  = document.getElementById('c');
var ctx = cv.getContext('2d');
var actEl  = document.getElementById('activity');
var hintEl = document.getElementById('hint');

var W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

var CFG = {
  maxSpeed:    96,     // px/s
  force:       420,    // px/s^2 steering cap
  margin:      64,
  hungerRate:  2.3,    // per second
  hungryAt:    45,     // will fetch food at/above this
  autoFeedAt:  44,     // food appears by itself at/above this hunger
  energyDrain: 2.0,    // awake drain per second
  sleepRegen:  11,     // per second -> ~9 s nap
  foodLife:    25,     // seconds before a dropped food fades
  maxFoods:    10,
  bites:       3,
  hungerPerBite: 16,
  energyPerBite:  4,
};

/* the dot ------------------------------------------------------------- */
var dot = {
  x: 0, y: 0, vx: 0, vy: 0,
  angle: Math.random() * Math.PI * 2,
  wanderA: Math.random() * Math.PI * 2,
  state: 'walk',            // walk | eat | sleep
  pause: 0,                 // seconds left standing still
  nextPause: 3,
  hunger: 8,
  energy: 80,
  eatFood: null, eatT: 0, biteAt: 0,
  sleepT: 0,
  bob: Math.random() * 6.3,
  sleepMix: 0,              // 0 awake .. 1 asleep (smoothed)
  glow: 1,                  // glow breath multiplier
};
dot.x = W / 2 || 683;
dot.y = H / 2 || 384;

var foods = [];      // {x,y,amount,life,phase,pop}
var parts = [];      // particles: {kind,x,y,vx,vy,life,ttl,size,text}
var trail = [];      // {x,y,a}
var trailT = 0, zzzT = 0, T = 0, firstFood = false;

/* ---------------------------------------------------------------- audio */
var AC = null;
function ensureAudio(){
  if (!AC){
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) AC = new C();
    } catch(e){ AC = null; }
  }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch(e){} }
}
function blip(freq, dur, vol, type, slideTo){
  if (!AC) return;
  try {
    var t0 = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(slideTo || Math.max(40, freq * 0.6), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}

/* ----------------------------------------------------------------- hud */
var ACT = { walk: 'walking around', eat: 'eating', sleep: 'sleeping' };
var shown = 'walking around';
function setActivity(state){
  var txt = ACT[state] || state;
  if (txt === shown) return;
  shown = txt;
  actEl.textContent = txt;
  actEl.classList.remove('anim');
  void actEl.offsetWidth;         // restart the fade-in
  actEl.classList.add('anim');
}

/* -------------------------------------------------------------- helpers */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function dist2(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function feed(x, y){
  if (foods.length >= CFG.maxFoods) foods.shift();
  foods.push({
    x: clamp(x, CFG.margin * 0.5, W - CFG.margin * 0.5),
    y: clamp(y, CFG.margin * 0.5, H - CFG.margin * 0.5),
    amount: CFG.bites, life: CFG.foodLife, phase: Math.random() * 6.3, pop: 0
  });
}
function burst(x, y, n, col){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 70;
    parts.push({ kind:'dot', x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 25,
                 life:0, ttl:0.5 + Math.random()*0.3, size:1.5 + Math.random()*1.8, col:col });
  }
}

/* --------------------------------------------------------------- update */
function targetFood(){
  if (dot.state !== 'walk' || dot.hunger < CFG.hungryAt) return null;
  var best = null, bd = Infinity;
  for (var i = 0; i < foods.length; i++){
    var f = foods[i];
    var d = dist2(dot.x, dot.y, f.x, f.y);
    if (d < bd){ bd = d; best = f; }
  }
  return best;
}

function update(dt){
  T += dt;
  dot.hunger = clamp(dot.hunger + CFG.hungerRate * dt, 0, 100);

  /* ---- it feeds itself: a meal appears wherever hunger builds (you just watch) */
  if (dot.state !== 'sleep' && foods.length === 0 && dot.hunger >= CFG.autoFeedAt){
    var ax = 0, ay = 0;
    for (var t = 0; t < 8; t++){
      ax = CFG.margin * 0.6 + Math.random() * Math.max(1, W - CFG.margin * 1.2);
      ay = CFG.margin * 0.6 + Math.random() * Math.max(1, H - CFG.margin * 1.2);
      if (dist2(ax, ay, dot.x, dot.y) > 150 * 150) break;
    }
    feed(ax, ay);
    if (!firstFood){ firstFood = true; hintEl.classList.add('gone'); }
  }

  /* ---- state machine */
  if (dot.state === 'sleep'){
    dot.sleepT += dt;
    dot.energy = clamp(dot.energy + CFG.sleepRegen * dt, 0, 100);
    dot.hunger = clamp(dot.hunger - 0.8 * dt, 0, 100);
    if (zzzT <= 0){
      parts.push({ kind:'z', x: dot.x + 8, y: dot.y - 16, vx: 6 + Math.random()*8,
                   vy: -24, life:0, ttl:1.7, size:13 });
      zzzT = 0.85;
    }
    zzzT -= dt;
    if (dot.energy >= 100){
      dot.state = 'walk';
      dot.pause = 0;
      dot.nextPause = T + 3 + Math.random() * 5;
      parts.push({ kind:'ring', x: dot.x, y: dot.y, life:0, ttl:0.7 });
      blip(430, 0.13, 0.05, 'sine', 640);
      blip(650, 0.16, 0.04, 'sine', 880);
      setActivity('walk');
    }
  } else {
    /* awake: burning energy */
    dot.energy = clamp(dot.energy - CFG.energyDrain * dt, 0, 100);
    if (dot.energy <= 0){
      dot.state = 'sleep';
      dot.sleepT = 0;
      dot.vx = dot.vy = 0;
      setActivity('sleep');
      blip(300, 0.5, 0.04, 'sine', 150);
    }
  }

  /* ---- eating */
  if (dot.state === 'eat'){
    dot.eatT += dt;
    var f = dot.eatFood;
    if (!f || foods.indexOf(f) < 0){                 // food vanished under us
      dot.state = 'walk'; dot.eatFood = null; setActivity('walk');
    } else {
      // nuzzle toward the food with a soft lunge each bite
      dot.x += (f.x - dot.x) * Math.min(1, dt * 6);
      dot.y += (f.y - dot.y) * Math.min(1, dt * 6);
      dot.angle = Math.atan2(f.y - dot.y, f.x - dot.x);
      if (T >= dot.biteAt){
        f.amount--;
        dot.hunger = clamp(dot.hunger - CFG.hungerPerBite, 0, 100);
        dot.energy = clamp(dot.energy + CFG.energyPerBite, 0, 100);
        burst(f.x, f.y, 5, 'rgba(255,190,110,1)');
        blip(560 - f.amount * 70, 0.09, 0.045, 'triangle', 320);
        dot.biteAt = T + 0.62;
        if (f.amount <= 0){
          foods.splice(foods.indexOf(f), 1);
          dot.eatFood = null;
        }
      }
      var done = dot.eatT > 0.45 && (!dot.eatFood || (dot.hunger < CFG.hungryAt && foods.length === 0));
      if (dot.eatT > 0.62 && !dot.eatFood) done = true;
      if (done){
        dot.state = 'walk';
        dot.eatFood = null;
        dot.pause = 0.3;
        setActivity('walk');
      }
    }
  }

  /* ---- steering */
  var target = (dot.state === 'walk') ? targetFood() : null;
  var dx = 0, dy = 0, wantSpeed = 0;

  if (dot.state === 'sleep'){
    wantSpeed = 0;
  } else if (dot.state === 'eat'){
    wantSpeed = 0;
  } else if (target){
    var tx = target.x - dot.x, ty = target.y - dot.y;
    var td = Math.sqrt(tx * tx + ty * ty) || 1;
    var arrive = clamp((td - 15) / 46, 0.1, 1);       // ease in near the food
    dx = tx / td; dy = ty / td;
    wantSpeed = CFG.maxSpeed * arrive;
    dot.pause = 0;
    if (td < 15){
      dot.state = 'eat';
      dot.eatFood = target;
      dot.eatT = 0;
      dot.biteAt = T + 0.3;
      dot.vx = dot.vy = 0;
      setActivity('eat');
      blip(500, 0.08, 0.04, 'triangle', 380);
    }
  } else {
    /* wander: smooth pseudo-noise heading + occasional rest */
    if (dot.pause > 0){
      dot.pause -= dt;
      wantSpeed = 0;
      if (dot.pause <= 0) dot.wanderA += (Math.random() - 0.5) * 1.2;
    } else {
      if (T > dot.nextPause){
        dot.pause = 0.4 + Math.random() * 1.1;
        dot.nextPause = T + 4 + Math.random() * 6;
        dot.wanderA += (Math.random() - 0.5) * 1.6;
      }
      dot.wanderA += (Math.sin(T * 0.9) * 0.6 +
                      Math.sin(T * 0.53 + 2.1) * 0.4 +
                      Math.sin(T * 1.7 + 0.7) * 0.3) * 1.7 * dt;
      dx = Math.cos(dot.wanderA);
      dy = Math.sin(dot.wanderA);
      wantSpeed = CFG.maxSpeed * (0.72 + 0.28 * (0.5 + 0.5 * Math.sin(T * 0.8 + dot.bob)));
      /* soft edge repulsion — curves instead of bouncing */
      if (dot.x < CFG.margin)              dx += (CFG.margin - dot.x) / CFG.margin * 2.2;
      if (dot.x > W - CFG.margin)          dx -= (dot.x - (W - CFG.margin)) / CFG.margin * 2.2;
      if (dot.y < CFG.margin)              dy += (CFG.margin - dot.y) / CFG.margin * 2.2;
      if (dot.y > H - CFG.margin)          dy -= (dot.y - (H - CFG.margin)) / CFG.margin * 2.2;
      var dl = Math.sqrt(dx * dx + dy * dy) || 1;
      dx /= dl; dy /= dl;
    }
  }

  /* arrive / accelerate with a capped force (never snaps) */
  var dvx = dx * wantSpeed - dot.vx;
  var dvy = dy * wantSpeed - dot.vy;
  var dlen = Math.sqrt(dvx * dvx + dvy * dvy);
  var maxStep = CFG.force * dt;
  if (dlen > maxStep && dlen > 0){ dvx = dvx / dlen * maxStep; dvy = dvy / dlen * maxStep; }
  dot.vx += dvx; dot.vy += dvy;

  /* gentle slalom wobble so paths aren't straight lines */
  var spd0 = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
  if (spd0 > 8 && dot.state === 'walk'){
    var pa = Math.atan2(dot.vy, dot.vx) + Math.PI / 2;
    var w = Math.sin(T * 5.1 + dot.bob) * 15;
    dot.vx += Math.cos(pa) * w * dt;
    dot.vy += Math.sin(pa) * w * dt;
  }
  var spd = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
  if (spd > CFG.maxSpeed){ dot.vx = dot.vx / spd * CFG.maxSpeed; dot.vy = dot.vy / spd * CFG.maxSpeed; }

  dot.x += dot.vx * dt;
  dot.y += dot.vy * dt;
  dot.x = clamp(dot.x, 8, W - 8);
  dot.y = clamp(dot.y, 8, H - 8);

  /* face the direction of travel smoothly */
  if (spd > 6){
    var want = Math.atan2(dot.vy, dot.vx);
    var diff = ((want - dot.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    dot.angle += diff * Math.min(1, dt * 5);
  }

  /* sleep blend + glow breath */
  var wantMix = dot.state === 'sleep' ? 1 : 0;
  dot.sleepMix += (wantMix - dot.sleepMix) * Math.min(1, dt * 2.2);
  var breathHz = dot.state === 'sleep' ? 0.55 : 2.1;
  dot.glow = 1 + Math.sin(T * Math.PI * 2 * breathHz) * (dot.state === 'sleep' ? 0.22 : 0.07);
  dot.glow *= 1 + Math.sin(T * 13.7) * 0.015;         // faint candle flicker

  /* ---- food decay */
  for (var i = foods.length - 1; i >= 0; i--){
    var fd = foods[i];
    fd.life -= dt;
    fd.pop = Math.min(1, fd.pop + dt * 5);
    if (fd.life <= 0) foods.splice(i, 1);
  }

  /* ---- trail */
  trailT -= dt;
  if (trailT <= 0 && spd > 14 && dot.state !== 'sleep'){
    trail.push({ x: dot.x, y: dot.y, a: 0.5 });
    trailT = 0.05;
  }
  for (var j = trail.length - 1; j >= 0; j--){
    trail[j].a -= dt * 1.7;
    if (trail[j].a <= 0) trail.splice(j, 1);
  }

  /* ---- particles */
  for (var k = parts.length - 1; k >= 0; k--){
    var p = parts[k];
    p.life += dt;
    if (p.life >= p.ttl){ parts.splice(k, 1); continue; }
    if (p.kind === 'dot'){
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt;
    } else if (p.kind === 'z'){
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
}

/* ---------------------------------------------------------------- draw */
function draw(){
  /* pitch black */
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  /* soft trail */
  for (var i = 0; i < trail.length; i++){
    var tr = trail[i];
    ctx.globalAlpha = tr.a * 0.16;
    ctx.fillStyle = '#ffb45e';
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, 5 + tr.a * 5, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* food */
  for (var f = 0; f < foods.length; f++){
    var fd = foods[f];
    var fade = clamp(fd.life / 4, 0, 1);
    var bob = Math.sin(T * 3 + fd.phase) * 2;
    var r = (4.5 + fd.amount) * fd.pop;
    var g = ctx.createRadialGradient(fd.x, fd.y + bob, 0, fd.x, fd.y + bob, 26);
    g.addColorStop(0, 'rgba(170,255,130,' + (0.75 * fade) + ')');
    g.addColorStop(0.4, 'rgba(120,240,110,' + (0.22 * fade) + ')');
    g.addColorStop(1, 'rgba(120,240,110,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(fd.x, fd.y + bob, 26, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(235,255,220,' + (0.95 * fade) + ')';
    ctx.beginPath(); ctx.arc(fd.x, fd.y + bob, r, 0, 6.2832); ctx.fill();
  }

  /* ---- the dot: glow, then squashy body ---- */
  var spd = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
  var stretch = clamp(spd / CFG.maxSpeed, 0, 1) * 0.20;
  var breath = 1 + Math.sin(T * Math.PI * 2 * (dot.state === 'sleep' ? 0.55 : 2.1)) *
               (dot.state === 'sleep' ? 0.05 : 0.03);
  var s = dot.sleepMix;                       // 0 awake, 1 asleep
  var glowR = (dot.state === 'eat' ? 52 : 46) * dot.glow * (1 - s * 0.25);

  /* colour: candle warm while awake, moonlit blue while asleep */
  var cr = Math.round(255 - s * 120), cg = Math.round(186 + s * 10), cb = Math.round(104 + s * 148);

  var glow = ctx.createRadialGradient(dot.x, dot.y, 0, dot.x, dot.y, glowR);
  glow.addColorStop(0,   'rgba(' + cr + ',' + cg + ',' + cb + ',' + (0.50 * dot.glow * (1 - s * 0.55)) + ')');
  glow.addColorStop(0.45,'rgba(' + cr + ',' + cg + ',' + cb + ',' + (0.16 * dot.glow * (1 - s * 0.55)) + ')');
  glow.addColorStop(1,   'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(dot.x, dot.y, glowR, 0, 6.2832); ctx.fill();

  /* body — squash along travel direction, breathe when idle */
  ctx.save();
  ctx.translate(dot.x, dot.y);
  ctx.rotate(dot.angle);
  ctx.scale((1 + stretch) * breath, (1 - stretch * 0.55) * breath);
  var core = ctx.createRadialGradient(-2, -2, 0, 0, 0, 11);
  core.addColorStop(0, 'rgba(255,255,255,' + (0.98 - s * 0.25) + ')');
  core.addColorStop(0.55, 'rgba(255,' + Math.round(240 - s * 40) + ',' + Math.round(215 - s * 60) + ',0.95)');
  core.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.15)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, 6.2832); ctx.fill();
  ctx.restore();

  /* wake ripple */
  for (var p = 0; p < parts.length; p++){
    var pt = parts[p];
    var lf = 1 - pt.life / pt.ttl;
    if (pt.kind === 'dot'){
      ctx.globalAlpha = lf;
      ctx.fillStyle = pt.col;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * lf, 0, 6.2832); ctx.fill();
    } else if (pt.kind === 'z'){
      ctx.globalAlpha = lf * 0.5;
      ctx.fillStyle = '#bcd3ff';
      ctx.font = pt.size + 'px Consolas, monospace';
      ctx.fillText('z', pt.x, pt.y);
    } else if (pt.kind === 'ring'){
      ctx.globalAlpha = lf * 0.5;
      ctx.strokeStyle = '#ffe9c0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 12 + (1 - lf) * 62, 0, 6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* ----------------------------------------------------------------- loop */
var last = null;
function frame(ts){
  if (last === null) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  if (dt > 0){ update(dt); draw(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ------------------------------------------------------------- input */
window.addEventListener('click', function(e){
  ensureAudio();
  feed(e.clientX, e.clientY);     // optional: you *can* drop treats, it doesn't need you
});
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });
setTimeout(function(){ hintEl.classList.add('gone'); }, 7000);

/* tiny hook so the simulation can be smoke-tested headlessly */
window.__dot = {
  get state(){ return dot.state; },
  get activity(){ return shown; },
  get hunger(){ return dot.hunger; },
  get energy(){ return dot.energy; },
  get pos(){ return { x: dot.x, y: dot.y }; },
  get speeds(){ return { vx: dot.vx, vy: dot.vy }; },
  set: function(o){
    o = o || {};
    if (typeof o.energy === 'number') dot.energy = clamp(o.energy, 0, 100);
    if (typeof o.hunger === 'number') dot.hunger = clamp(o.hunger, 0, 100);
  },
  foods: foods,
};
})();
</script>
</body>
</html>
